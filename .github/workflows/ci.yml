name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Fuzz smoke
        run: make fuzz-smoke
      - name: Contract and schema tests
        run: go test ./api ./internal/commands
      - name: Generated client drift
        run: make generate

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Create disposable Compose credentials
        shell: bash
        run: |
          cat > .env.ci <<'EOF'
          GAMESERVICE_ADMIN_PASSWORD=ci-admin-password
          POSTGRES_PASSWORD=ci-gameservice-password
          NAKAMA_DATABASE_PASSWORD=ci-nakama-password
          NAKAMA_CONSOLE_USERNAME=admin
          NAKAMA_CONSOLE_PASSWORD=ci-console-password
          NAKAMA_CONSOLE_SIGNING_KEY=ci-console-signing-key
          NAKAMA_SOCKET_SERVER_KEY=ci-socket-server-key
          NAKAMA_SESSION_ENCRYPTION_KEY=ci-session-encryption-key
          NAKAMA_SESSION_REFRESH_ENCRYPTION_KEY=ci-session-refresh-key
          NAKAMA_SESSION_SIGNING_KEY=ci-session-encryption-key
          NAKAMA_RUNTIME_HTTP_KEY=ci-runtime-http-key
          TURN_REALM=ci.example.invalid
          TURN_SECRET=ci-turn-secret
          TURN_EXTERNAL_IP=127.0.0.1
          EOF
      - name: Start real integration services
        shell: bash
        run: |
          set -eu
          trap 'docker compose --env-file .env.ci -f deploy/compose/compose.yaml down -v' EXIT
          docker compose --env-file .env.ci -f deploy/compose/compose.yaml \
            up -d postgres database-admin-bootstrap nakama-role-bootstrap migrations nakama control-api
          docker compose --env-file .env.ci -f deploy/compose/compose.yaml run --rm migrations \
            sh -ec 'psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f /migrations/001_control.down.sql'
          docker compose --env-file .env.ci -f deploy/compose/compose.yaml run --rm migrations
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:7350/healthcheck >/dev/null && break
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:7350/healthcheck >/dev/null
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:8080/health/ready >/dev/null && break
            sleep 2
          done
          curl --fail --silent http://127.0.0.1:8080/health/ready >/dev/null
          DATABASE_URL='postgres://gameservice:ci-gameservice-password@127.0.0.1:5432/gameservice?sslmode=disable' \
            go test -tags=integration ./...

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Lint production chart
        run: >-
          helm lint deploy/helm/platform
          --set images.controlApi.digest=sha256:1111111111111111111111111111111111111111111111111111111111111111
          --set images.outboxWorker.digest=sha256:2222222222222222222222222222222222222222222222222222222222222222
          --set images.leaderboardWorker.digest=sha256:3333333333333333333333333333333333333333333333333333333333333333
          --set images.matchmakingWorker.digest=sha256:5555555555555555555555555555555555555555555555555555555555555555
          --set images.reconciliationWorker.digest=sha256:6666666666666666666666666666666666666666666666666666666666666666
          --set images.migrations.digest=sha256:4444444444444444444444444444444444444444444444444444444444444444

  supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Go vulnerability scan
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          go-package: ./...
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Filesystem vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Generate source SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: gameservice-source-sbom.cdx.json
          output-file: gameservice-source-sbom.cdx.json
      - name: Render production chart
        run: >-
          helm template gameservice deploy/helm/platform
          -f deploy/helm/platform/values.production.example.yaml
          --set images.controlApi.digest=sha256:1111111111111111111111111111111111111111111111111111111111111111
          --set images.outboxWorker.digest=sha256:2222222222222222222222222222222222222222222222222222222222222222
          --set images.leaderboardWorker.digest=sha256:3333333333333333333333333333333333333333333333333333333333333333
          --set images.matchmakingWorker.digest=sha256:5555555555555555555555555555555555555555555555555555555555555555
          --set images.reconciliationWorker.digest=sha256:6666666666666666666666666666666666666666666666666666666666666666
          --set images.migrations.digest=sha256:4444444444444444444444444444444444444444444444444444444444444444
          --set gameServer.image.digest=sha256:7777777777777777777777777777777777777777777777777777777777777777
