name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race ./...
      - name: Contract and schema tests
        run: go test ./api ./internal/commands
      - name: Generated client drift
        run: make generate

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0
      - name: Lint production chart
        run: >-
          helm lint deploy/helm/platform
          --set images.controlApi.digest=sha256:1111111111111111111111111111111111111111111111111111111111111111
          --set images.outboxWorker.digest=sha256:2222222222222222222222222222222222222222222222222222222222222222
          --set images.leaderboardWorker.digest=sha256:3333333333333333333333333333333333333333333333333333333333333333
          --set images.matchmakingWorker.digest=sha256:5555555555555555555555555555555555555555555555555555555555555555
          --set images.reconciliationWorker.digest=sha256:6666666666666666666666666666666666666666666666666666666666666666
          --set images.migrations.digest=sha256:4444444444444444444444444444444444444444444444444444444444444444
      - name: Render production chart
        run: >-
          helm template gameservice deploy/helm/platform
          --set images.controlApi.digest=sha256:1111111111111111111111111111111111111111111111111111111111111111
          --set images.outboxWorker.digest=sha256:2222222222222222222222222222222222222222222222222222222222222222
          --set images.leaderboardWorker.digest=sha256:3333333333333333333333333333333333333333333333333333333333333333
          --set images.matchmakingWorker.digest=sha256:5555555555555555555555555555555555555555555555555555555555555555
          --set images.reconciliationWorker.digest=sha256:6666666666666666666666666666666666666666666666666666666666666666
          --set images.migrations.digest=sha256:4444444444444444444444444444444444444444444444444444444444444444
