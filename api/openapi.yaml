openapi: 3.0.3
info:
  title: GameService Control API
  version: 0.1.0
  description: >-
    Declarative, idempotent game backend control plane. Mutation command
    arguments reject unknown envelope fields, non-finite numbers, strings or
    keys over 4096 bytes, collections over 128 entries, and nesting beyond
    eight levels. Economy quantities and amounts are bounded by the server.
servers:
  - url: http://localhost:8080
security:
  - NakamaSession: []
paths:
  /v1/commands:
    post:
      operationId: submitCommand
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Command' }
      responses:
        '200':
          description: Idempotent command result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommandResult' }
        '400': { description: Invalid command }
  /v1/commands/{requestId}:
    parameters:
      - name: requestId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    get:
      operationId: getCommandResult
      responses:
        '200':
          description: Stored command result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommandResult' }
        '404': { description: Command not found }
  /v1/players/me/snapshot:
    get: { operationId: getPlayerSnapshot, responses: { '200': { description: Player snapshot } } }
  /v1/players/me/inventory:
    get: { operationId: getPlayerInventory, responses: { '200': { description: Player inventory } } }
  /v1/players/me/wallets:
    get: { operationId: getPlayerWallets, responses: { '200': { description: Player wallets } } }
  /v1/players/me/privacy/export:
    post: { operationId: exportPlayerAccount, parameters: [{ name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }], responses: { '200': { description: Account export } } }
  /v1/players/me/privacy/delete:
    post: { operationId: deletePlayerAccount, parameters: [{ name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }], responses: { '200': { description: Account deletion tombstone } } }
  /v1/matchmaking/tickets:
    post:
      operationId: createMatchmakingTicket
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/TicketRequest' } } }
      responses:
        '202': { description: Ticket accepted, content: { application/json: { schema: { $ref: '#/components/schemas/Ticket' } } } }
  /v1/matchmaking/tickets/{ticketId}:
    parameters:
      - name: ticketId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    get: { operationId: getMatchmakingTicket, responses: { '200': { description: Ticket status } } }
    delete: { operationId: cancelMatchmakingTicket, responses: { '204': { description: Ticket cancelled } } }
  /v1/matches/{matchId}:
    parameters:
      - name: matchId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    get: { operationId: getMatch, responses: { '200': { description: Match state, content: { application/json: { schema: { $ref: '#/components/schemas/Match' } } } } } }
  /v1/matches/{matchId}/join-claims:
    parameters:
      - name: matchId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    post: { operationId: issueJoinClaims, responses: { '200': { description: Join claims, content: { application/json: { schema: { $ref: '#/components/schemas/JoinClaimResponse' } } } } } }
  /v1/server/matches/{matchId}/ready:
    parameters:
      - name: matchId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    post: { operationId: markMatchReady, security: [{ ServerClaim: [] }], responses: { '204': { description: Match ready } } }
  /v1/server/matches/{matchId}/heartbeat:
    parameters:
      - name: matchId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    post: { operationId: matchHeartbeat, security: [{ ServerClaim: [] }], responses: { '204': { description: Heartbeat accepted } } }
  /v1/server/matches/{matchId}/start:
    parameters:
      - name: matchId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    post: { operationId: startMatch, security: [{ ServerClaim: [] }], responses: { '204': { description: Match running } } }
  /v1/server/matches/{matchId}/results:
    parameters:
      - name: matchId
        in: path
        required: true
        schema: { type: string, minLength: 1 }
    post: { operationId: submitMatchResult, security: [{ ServerClaim: [] }], responses: { '202': { description: Result accepted } } }
  /v1/admin/definitions/validate:
    post: { operationId: validateDefinition, security: [{ AdminSession: [] }], responses: { '200': { description: Validation report } } }
  /v1/admin/definitions/dry-run:
    post: { operationId: dryRunDefinition, security: [{ AdminSession: [] }], parameters: [{ name: gameId, in: query, required: false, schema: { type: string } }, { name: revision, in: query, required: false, schema: { type: integer, minimum: 1 } }], responses: { '200': { description: Validation and non-mutating impact plan } } }
  /v1/admin/definitions:
    post: { operationId: publishDefinition, security: [{ AdminSession: [] }], responses: { '201': { description: Published immutable revision } } }
  /v1/admin/definitions/{revision}/approval:
    parameters:
      - name: revision
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post: { operationId: requestOrApproveDefinition, security: [{ AdminSession: [] }], parameters: [{ name: gameId, in: query, required: true, schema: { type: string, minLength: 1 } }, { name: environment, in: query, required: true, schema: { type: string, minLength: 1 } }], responses: { '200': { description: Pending or approved two-actor activation approval } } }
  /v1/admin/definitions/{revision}/activate:
    parameters:
      - name: revision
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post: { operationId: activateDefinition, security: [{ AdminSession: [] }], responses: { '204': { description: Definition activated } } }
  /v1/admin/definitions/{revision}/rollback:
    parameters:
      - name: revision
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
    post: { operationId: rollbackDefinition, security: [{ AdminSession: [] }], responses: { '204': { description: Definition rolled back } } }
  /v1/admin/audit:
    get: { operationId: searchAudit, security: [{ AdminSession: [] }], responses: { '200': { description: Audit records } } }
  /metrics:
    get: { operationId: metrics, security: [], responses: { '200': { description: Prometheus metrics } } }
  /health/live:
    get: { operationId: liveness, security: [], responses: { '200': { description: OK } } }
  /health/ready:
    get: { operationId: readiness, security: [], responses: { '200': { description: OK } } }
components:
  securitySchemes:
    NakamaSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Nakama-issued player or administrator session JWT.
    AdminSession:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Nakama session JWT carrying the required administrator scope.
    ServerClaim:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Short-lived match-scoped server claim.
  schemas:
    Command:
      type: object
      additionalProperties: false
      required: [apiVersion, kind, metadata, actor, spec]
      properties:
        apiVersion: { type: string, enum: [game.platform/v1alpha1] }
        kind: { type: string, enum: [Command] }
        metadata: { $ref: '#/components/schemas/Metadata' }
        actor: { $ref: '#/components/schemas/Actor' }
        spec: { $ref: '#/components/schemas/Spec' }
    Metadata:
      type: object
      additionalProperties: false
      required: [requestId, correlationId, gameId, environment, definitionRevision]
      properties:
        requestId: { type: string, minLength: 1 }
        correlationId: { type: string, minLength: 1 }
        gameId: { type: string, minLength: 1 }
        environment: { type: string, minLength: 1 }
        definitionRevision: { type: integer, minimum: 1 }
    Actor:
      type: object
      description: The actor ID must match the authenticated identity; actor type is derived from the operation scope at the HTTP boundary.
      additionalProperties: false
      required: [type, id]
      properties:
        type: { type: string, minLength: 1 }
        id: { type: string, minLength: 1 }
    Spec:
      type: object
      additionalProperties: false
      required: [operation, arguments]
      properties:
        operation: { type: string, minLength: 1 }
        arguments: { type: object, maxProperties: 64 }
    CommandResult:
      type: object
      required: [requestId, correlationId, status, operation]
      properties:
        requestId: { type: string }
        correlationId: { type: string }
        status: { type: string, enum: [succeeded, rejected] }
        operation: { type: string }
    TicketRequest:
      type: object
      description: Public player sessions submit one-player tickets. Multi-player party tickets require a trusted Nakama adapter and are not accepted directly from a player session.
      additionalProperties: false
      required: [gameId, environment, modeId, definitionRevision, build, region, capacity, playerIds, expiresAt]
      properties:
        gameId: { type: string, minLength: 1 }
        environment: { type: string, minLength: 1 }
        modeId: { type: string, minLength: 1 }
        definitionRevision: { type: integer, minimum: 1 }
        build: { type: string, minLength: 1 }
        region: { type: string, minLength: 1 }
        capacity: { type: integer, minimum: 1 }
        playerIds: { type: array, minItems: 1, items: { type: string, minLength: 1 } }
        properties: { type: object }
        expiresAt: { type: string, format: date-time }
    Ticket:
      allOf:
        - $ref: '#/components/schemas/TicketRequest'
        - type: object
          required: [ticketId, status, createdAt]
          properties:
            ticketId: { type: string }
            matchId: { type: string }
            status: { type: string, enum: [queued, matching, matched, cancelled, expired] }
            createdAt: { type: string, format: date-time }
    Match:
      type: object
      required: [matchId, gameId, environment, modeId, definitionRevision, state, build, roster]
      properties:
        matchId: { type: string }
        gameId: { type: string }
        environment: { type: string }
        modeId: { type: string }
        definitionRevision: { type: integer }
        state: { type: string, enum: [Queued, Matched, Allocating, Ready, Running, Finalizing, Completed, Abandoned, Disputed, Failed, Cancelled] }
        build: { type: string }
        allocationId: { type: string }
        serverAddress: { type: string }
        serverPorts: { type: object, additionalProperties: { type: integer } }
        roster: { type: array, items: { $ref: '#/components/schemas/RosterMember' } }
    RosterMember:
      type: object
      required: [playerId, slot]
      properties:
        playerId: { type: string }
        slot: { type: integer, minimum: 0 }
        team: { type: string }
    JoinClaimResponse:
      type: object
      required: [matchId, token]
      properties:
        matchId: { type: string }
        token: { type: string }
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
