apiVersion: apps/v1
kind: Deployment
metadata: { name: gameservice-control-api, namespace: {{ .Values.namespace.app }} }
spec:
  replicas: {{ .Values.replicaCount }}
  selector: { matchLabels: { app: gameservice-control-api } }
  template:
    metadata: { labels: { app: gameservice-control-api } }
    spec:
      serviceAccountName: gameservice
      containers:
        - name: control-api
          image: {{ include "gameservice.image" (dict "Values" .Values "name" "controlApi") | quote }}
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: CONTROL_API_ADDR, value: ":8080" }
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: {{ .Values.database.secretName }}, key: {{ .Values.database.urlKey }} } } }
            - { name: NAKAMA_SESSION_SIGNING_KEY, valueFrom: { secretKeyRef: { name: {{ .Values.nakama.secretName }}, key: {{ .Values.nakama.signingKeyKey }} } } }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ .Values.otel.endpoint | quote }} }
          readinessProbe: { httpGet: { path: /health/ready, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, periodSeconds: 10 }
          resources: {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata: { name: gameservice-control-api, namespace: {{ .Values.namespace.app }} }
spec:
  selector: { app: gameservice-control-api }
  ports: [{ name: http, port: {{ .Values.service.port }}, targetPort: http }]
