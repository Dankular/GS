apiVersion: apps/v1
kind: Deployment
metadata: { name: gameservice-control-api, namespace: {{ .Values.namespace.app }} }
spec:
  replicas: {{ .Values.replicaCount }}
  selector: { matchLabels: { app: gameservice-control-api } }
  template:
    metadata: { labels: { app: gameservice-control-api } }
    spec:
      serviceAccountName: gameservice
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ .Values.pod.terminationGracePeriodSeconds }}
      securityContext:
{{ toYaml .Values.pod.securityContext | nindent 8 }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.pod.topologySpread.maxSkew }}
          topologyKey: {{ .Values.pod.topologySpread.topologyKey }}
          whenUnsatisfiable: {{ .Values.pod.topologySpread.whenUnsatisfiable }}
          labelSelector: { matchLabels: { app: gameservice-control-api } }
      containers:
        - name: control-api
          image: {{ include "gameservice.image" (dict "Values" .Values "name" "controlApi") | quote }}
          ports: [{ name: http, containerPort: 8080 }]
          securityContext:
{{ toYaml .Values.pod.containerSecurityContext | nindent 12 }}
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
          env:
            - { name: CONTROL_API_ADDR, value: ":8080" }
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: {{ .Values.database.secretName }}, key: {{ .Values.database.urlKey }} } } }
            - { name: NAKAMA_URL, value: {{ .Values.nakama.url | quote }} }
            - { name: NAKAMA_RUNTIME_HTTP_KEY, valueFrom: { secretKeyRef: { name: {{ .Values.nakama.secretName }}, key: {{ .Values.nakama.runtimeHTTPKeySecretKey }} } } }
            - { name: NAKAMA_SESSION_SIGNING_KEY, valueFrom: { secretKeyRef: { name: {{ .Values.nakama.secretName }}, key: {{ .Values.nakama.signingKeyKey }} } } }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ .Values.otel.endpoint | quote }} }
            - name: SERVER_CLAIM_PUBLIC_KEYS
              valueFrom: { secretKeyRef: { name: {{ .Values.serverClaims.publicKeysSecretName }}, key: {{ .Values.serverClaims.publicKeysSecretKey }} } }
            - name: JOIN_CLAIM_PRIVATE_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.serverClaims.privateKeySecretName }}, key: {{ .Values.serverClaims.privateKeySecretKey }} } }
          readinessProbe: { httpGet: { path: /health/ready, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health/live, port: http }, periodSeconds: 10 }
          resources: {{- toYaml .Values.resources | nindent 12 }}
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: gameservice-control-api, namespace: {{ .Values.namespace.app }} }
spec:
  selector: { app: gameservice-control-api }
  ports: [{ name: http, port: {{ .Values.service.port }}, targetPort: http }]
