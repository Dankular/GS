apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "gameservice.name" . }}-migration-{{ .Release.Revision }}
  namespace: {{ .Values.namespace.app }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata: { labels: { app.kubernetes.io/name: gameservice-migration } }
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrations
          image: {{ include "gameservice.image" (dict "Values" .Values "name" "migrations") | quote }}
          command: ["sh", "-ec"]
          args: ["psql \"$DATABASE_URL\" -f /migrations/001_control.sql"]
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: {{ .Values.database.secretName }}, key: {{ .Values.database.urlKey }} } }
          volumeMounts: [{ name: migrations, mountPath: /migrations, readOnly: true }]
      volumes: [{ name: migrations, configMap: { name: gameservice-migrations } }]
