{{- if .Values.postgresCluster.enabled }}
{{- if not (regexMatch "^sha256:[0-9a-f]{64}$" .Values.postgresCluster.imageDigest) }}
{{- fail "postgresCluster.imageDigest must be an immutable sha256 digest when postgresCluster.enabled=true" }}
{{- end }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ .Values.postgresCluster.name }}
  namespace: {{ .Values.namespace.app }}
  labels:
    app.kubernetes.io/name: {{ .Values.postgresCluster.name }}
    app.kubernetes.io/part-of: gameservice
spec:
  instances: {{ .Values.postgresCluster.instances }}
  imageName: {{ printf "%s@%s" .Values.postgresCluster.imageName .Values.postgresCluster.imageDigest | quote }}
  primaryUpdateStrategy: unsupervised
  storage:
    size: {{ .Values.postgresCluster.storageSize }}
  affinity:
    enablePodAntiAffinity: {{ .Values.postgresCluster.affinity.enablePodAntiAffinity }}
    topologyKey: {{ .Values.postgresCluster.affinity.topologyKey | quote }}
    podAntiAffinityType: {{ .Values.postgresCluster.affinity.podAntiAffinityType | quote }}
{{- if .Values.postgresCluster.backup.enabled }}
{{- if not .Values.postgresCluster.backup.destinationPath }}
{{- fail "postgresCluster.backup.destinationPath is required when backups are enabled" }}
{{- end }}
{{- if and (ne .Values.postgresCluster.backup.method "legacy") (ne .Values.postgresCluster.backup.method "plugin") }}
{{- fail "postgresCluster.backup.method must be legacy or plugin" }}
{{- end }}
{{- if eq .Values.postgresCluster.backup.method "plugin" }}
  plugins:
    - name: {{ .Values.postgresCluster.backup.pluginName | quote }}
      isWALArchiver: true
      parameters:
        barmanObjectName: {{ .Values.postgresCluster.backup.objectStoreName | quote }}
{{- else }}
  backup:
    barmanObjectStore:
      destinationPath: {{ .Values.postgresCluster.backup.destinationPath | quote }}
      s3Credentials:
        accessKeyId:
          name: {{ .Values.postgresCluster.backup.s3CredentialsSecretName }}
          key: {{ .Values.postgresCluster.backup.accessKeyIdKey }}
        secretAccessKey:
          name: {{ .Values.postgresCluster.backup.s3CredentialsSecretName }}
          key: {{ .Values.postgresCluster.backup.secretAccessKeyKey }}
      wal:
        compression: {{ .Values.postgresCluster.backup.walCompression | quote }}
        encryption: {{ .Values.postgresCluster.backup.walEncryption | quote }}
    retentionPolicy: {{ .Values.postgresCluster.backup.retentionPolicy | quote }}
{{- end }}
{{- end }}
  bootstrap:
    initdb:
      database: {{ .Values.postgresCluster.database | quote }}
      owner: {{ .Values.postgresCluster.owner | quote }}
{{- end }}
