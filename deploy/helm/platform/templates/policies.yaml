apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: gameservice-control-api, namespace: {{ .Values.namespace.app }} }
spec: { minAvailable: 1, selector: { matchLabels: { app: gameservice-control-api } } }
---
{{- range $worker := list "outbox" "leaderboard" "matchmaking" "reconciliation" }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: gameservice-{{ $worker }}-worker, namespace: {{ $.Values.namespace.app }} }
spec: { minAvailable: 1, selector: { matchLabels: { app: gameservice-{{ $worker }}-worker } } }
---
{{- end }}
---
{{- if .Values.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: gameservice-control-api, namespace: {{ .Values.namespace.app }} }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: gameservice-control-api }
  minReplicas: {{ .Values.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.autoscaling.maxReplicas }}
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ .Values.autoscaling.targetCPUUtilizationPercentage }} } } }]
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: gameservice-default-deny, namespace: {{ .Values.namespace.app }} }
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: gameservice-control-egress, namespace: {{ .Values.namespace.app }} }
spec:
  podSelector: { matchLabels: { app: gameservice-control-api } }
  policyTypes: [Egress]
  egress:
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Values.namespace.app }} } } }]
      ports: [{ protocol: TCP, port: 7350 }]
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: agones-system } } }]
      ports: [{ protocol: TCP, port: 443 }]
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Values.otel.namespace }} } } }]
      ports: [{ protocol: TCP, port: 4318 }]
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } } }]
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
{{- if .Values.database.egressCIDRs }}
    - to:
{{- range .Values.database.egressCIDRs }}
        - ipBlock: { cidr: {{ . | quote }} }
{{- end }}
      ports: [{ protocol: TCP, port: 5432 }]
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: gameservice-workers-egress, namespace: {{ .Values.namespace.app }} }
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [gameservice-outbox-worker, gameservice-leaderboard-worker, gameservice-matchmaking-worker, gameservice-reconciliation-worker]
  policyTypes: [Egress]
  egress:
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Values.namespace.app }} } } }]
      ports: [{ protocol: TCP, port: 7350 }]
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: agones-system } } }]
      ports: [{ protocol: TCP, port: 443 }]
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } } }]
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
{{- if .Values.database.egressCIDRs }}
    - to:
{{- range .Values.database.egressCIDRs }}
        - ipBlock: { cidr: {{ . | quote }} }
{{- end }}
      ports: [{ protocol: TCP, port: 5432 }]
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: gameservice-control-ingress, namespace: {{ .Values.namespace.app }} }
spec:
  podSelector: { matchLabels: { app: gameservice-control-api } }
  policyTypes: [Ingress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: platform-edge } } }]
      ports: [{ protocol: TCP, port: 8080 }]
