# Production shape only. Supply real values through the release system or
# external secret manager; do not commit credentials or placeholder digests.
replicaCount: 2
ingress:
  enabled: true
  className: nginx
  host: api.gameservice.example.com
  tlsSecretName: gameservice-control-api-tls
  annotations:
    nginx.ingress.kubernetes.io/limit-rps: "100"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
database:
  secretName: gameservice-production-secrets
  urlKey: database-url
externalSecrets:
  enabled: true
  secretStoreRef:
    name: gameservice-production
    kind: ClusterSecretStore
  remoteKey: gameservice/production
  refreshInterval: 1h
  targetSecretName: gameservice-production-secrets
nakama:
  url: https://nakama.platform.example.com
metrics:
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
gameServer:
  enabled: true
  serverClaimsSecretName: gameservice-production-secrets
  image:
    repository: ghcr.io/dankular/gameservice-server
    digest: sha256:REPLACE_WITH_APPROVED_SERVER_DIGEST
  build: arena
  buildId: REPLACE_WITH_APPROVED_BUILD_ID
