imagePullSecrets: []
images:
  controlApi: { repository: ghcr.io/dankular/gameservice-control-api, digest: "" }
  outboxWorker: { repository: ghcr.io/dankular/gameservice-outbox-worker, digest: "" }
  leaderboardWorker: { repository: ghcr.io/dankular/gameservice-leaderboard-worker, digest: "" }
  matchmakingWorker: { repository: ghcr.io/dankular/gameservice-matchmaking-worker, digest: "" }
  reconciliationWorker: { repository: ghcr.io/dankular/gameservice-reconciliation-worker, digest: "" }
  migrations: { repository: postgres, digest: "" }
replicaCount: 2
namespace:
  app: platform-app
  edge: platform-edge
  gameservers: platform-gameservers-eu-west
  observability: platform-observability
service:
  port: 8080
ingress:
  enabled: false
  className: nginx
  host: gameservice.example.invalid
  tlsSecretName: gameservice-control-api-tls
  annotations: {}
resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { cpu: 1, memory: 512Mi }
database:
  secretName: gameservice-secrets
  urlKey: database-url
  egressCIDRs: []
postgresCluster:
  # Optional CloudNativePG-managed PostgreSQL cluster. Keep disabled when the
  # release uses a managed/external PostgreSQL service.
  enabled: false
  name: gameservice-postgres
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16.4
  imageDigest: ""
  storageSize: 20Gi
  database: gameservice
  owner: gameservice
externalSecrets:
  enabled: false
  secretStoreRef:
    name: gameservice-secrets
    kind: ClusterSecretStore
  remoteKey: gameservice/production
  refreshInterval: 1h
  targetSecretName: gameservice-secrets
nakama:
  secretName: gameservice-secrets
  signingKeyKey: nakama-session-signing-key
  url: http://nakama.platform-app.svc.cluster.local:7350
  serverKeySecretKey: nakama-server-key
  runtimeHTTPKeySecretKey: nakama-runtime-http-key
otel:
  endpoint: otel-collector.platform-observability.svc.cluster.local:4318
  namespace: platform-observability
metrics:
  serviceMonitor:
    enabled: false
    interval: 15s
    scrapeTimeout: 10s
    labels: {}
allocator:
  endpoint: allocator.agones-system.svc.cluster.local:443
  serverName: allocator.agones-system.svc.cluster.local
  namespace: platform-gameservers-eu-west
  secretName: gameservice-allocator-mtls
  caKey: ca.pem
  certKey: client.crt
  privateKey: client.key
matchmaking:
  teamSize: 1
  teams: 2
  ratingWindow: 0
  protocol: udp
  intervalSeconds: 2
reconciliation:
  intervalSeconds: 300
  allocationTimeoutSeconds: 120
  runningTimeoutSeconds: 180
pod:
  terminationGracePeriodSeconds: 30
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile: { type: RuntimeDefault }
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities: { drop: [ALL] }
  topologySpread:
    maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
serverClaims:
  publicKeysSecretName: gameservice-secrets
  publicKeysSecretKey: server-claim-public-keys
  publicKeySecretKey: server-claim-public-key
  privateKeySecretName: gameservice-secrets
  privateKeySecretKey: server-claim-private-key
  ttlSeconds: 600
gameServer:
  enabled: false
  name: arena-deathmatch
  image: { repository: ghcr.io/dankular/gameservice-server, digest: "" }
  replicas: 2
  build: ""
  buildId: ""
  region: eu-west
  protocol: "3"
  maxAllocationAttempts: 3
  gamePort: 7000
  httpPort: 7001
  controlApiURL: http://gameservice-control-api:8080
  serverClaimsSecretName: gameservice-secrets
  serverClaimsPublicKey: server-claim-public-key
  autoscaler:
    bufferSize: 2
    minReplicas: 2
    maxReplicas: 8
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70
supplyChain:
  admissionPolicy:
    enabled: false
    name: gameservice-verify-images
    imagePattern: ghcr.io/dankular/gameservice-*
    issuerRegExp: https://token.actions.githubusercontent.com
    subjectRegExp: https://github.com/Dankular/GS/.github/workflows/release.yml@refs/tags/v.*
    rekorURL: https://rekor.sigstore.dev
