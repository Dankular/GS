services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib@sha256:799dc6cf12c96192af37b5bdba804da8c10b3bc563b43cb90c3f3c58d9572ad6
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes: [../../deploy/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro]
    ports: ["4317:4317", "4318:4318", "9464:9464"]
  prometheus:
    profiles: [observability]
    image: prom/prometheus@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    command: ["--config.file=/etc/prometheus/prometheus.yaml", "--storage.tsdb.path=/prometheus", "--web.enable-lifecycle"]
    volumes:
      - prometheus-data:/prometheus
      - ../../deploy/observability/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - ../../deploy/observability/prometheus-rules.yaml:/etc/prometheus/rules/prometheus-rules.yaml:ro
    ports: ["9090:9090"]
    depends_on: [otel-collector, control-api, alertmanager]
  alertmanager:
    profiles: [observability]
    image: prom/alertmanager@sha256:27c475db5fb156cab31d5c18a4251ac7ed567746a2483ff264516437a39b15ba
    entrypoint: ["/bin/sh", "-ec"]
    command: ["test -n \"$${ALERTMANAGER_WEBHOOK_URL}\" || { echo 'ALERTMANAGER_WEBHOOK_URL is required' >&2; exit 1; }; sed \"s#__ALERTMANAGER_WEBHOOK_URL__#$${ALERTMANAGER_WEBHOOK_URL}#g\" /etc/alertmanager/alertmanager.yaml > /tmp/alertmanager.yaml; exec /bin/alertmanager --config.file=/tmp/alertmanager.yaml --storage.path=/alertmanager"]
    environment:
      ALERTMANAGER_WEBHOOK_URL: ${ALERTMANAGER_WEBHOOK_URL:-}
    volumes:
      - alertmanager-data:/alertmanager
      - ../../deploy/observability/alertmanager.yaml:/etc/alertmanager/alertmanager.yaml:ro
    ports: ["9093:9093"]
  grafana:
    profiles: [observability]
    image: grafana/grafana@sha256:a1701c2180249361737a99a01bc770db39381640e4d631825d38ff4535efa47d
    entrypoint: ["/bin/sh", "-ec"]
    command: ["test -n \"$${GF_SECURITY_ADMIN_PASSWORD}\" || { echo 'GRAFANA_ADMIN_PASSWORD is required' >&2; exit 1; }; exec /run.sh"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../../deploy/observability/grafana-datasource.yaml:/etc/grafana/provisioning/datasources/gameservice.yaml:ro
      - ../../deploy/observability/grafana-dashboard-provider.yaml:/etc/grafana/provisioning/dashboards/gameservice.yaml:ro
      - ../../deploy/observability/gameservice-dashboard.json:/var/lib/grafana/dashboards/gameservice-dashboard.json:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
  postgres:
    image: postgres@sha256:21f6013073bc6b92830a2129570e2f5ec42a6c734b5a985a41e83aa58f54c3c1
    environment:
      POSTGRES_DB: gameservice
      POSTGRES_USER: gameservice_admin
      POSTGRES_PASSWORD: ${GAMESERVICE_ADMIN_PASSWORD:?set GAMESERVICE_ADMIN_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck: { test: [CMD-SHELL, 'pg_isready -U gameservice_admin -d gameservice'], interval: 5s, timeout: 5s, retries: 10 }
  database-admin-bootstrap:
    image: postgres@sha256:21f6013073bc6b92830a2129570e2f5ec42a6c734b5a985a41e83aa58f54c3c1
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 --set=app_password="$$POSTGRES_PASSWORD" <<'SQL'
        SELECT format('CREATE ROLE gameservice LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE', :'app_password')
        WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'gameservice') \gexec
        SELECT format('ALTER ROLE gameservice LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE', :'app_password')
        WHERE EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'gameservice') \gexec
        GRANT CONNECT, CREATE, TEMPORARY ON DATABASE gameservice TO gameservice;
        GRANT USAGE, CREATE ON SCHEMA public TO gameservice;
        SQL
    environment:
      DATABASE_URL: postgres://gameservice_admin:${GAMESERVICE_ADMIN_PASSWORD}@postgres:5432/gameservice?sslmode=disable
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
  nakama-role-bootstrap:
    image: postgres@sha256:21f6013073bc6b92830a2129570e2f5ec42a6c734b5a985a41e83aa58f54c3c1
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        psql "$$DATABASE_URL" -v ON_ERROR_STOP=1 --set=nakama_password="$$NAKAMA_DATABASE_PASSWORD" <<'SQL'
        SELECT format('CREATE ROLE nakama LOGIN PASSWORD %L', :'nakama_password')
        WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'nakama') \gexec
        SELECT format('ALTER ROLE nakama LOGIN PASSWORD %L', :'nakama_password')
        WHERE EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'nakama') \gexec
        GRANT CONNECT ON DATABASE gameservice TO nakama;
        GRANT USAGE, CREATE ON SCHEMA public TO nakama;
        SELECT format('ALTER TABLE public.%I OWNER TO nakama', tablename)
        FROM pg_tables WHERE schemaname = 'public' AND tableowner = current_user \gexec
        SELECT format('ALTER SEQUENCE public.%I OWNER TO nakama', sequencename)
        FROM pg_sequences WHERE schemaname = 'public' AND sequenceowner = current_user \gexec
        ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO nakama;
        ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO nakama;
        REVOKE ALL ON SCHEMA platform, economy, progression, match, ops FROM nakama;
        REVOKE ALL ON SCHEMA platform, economy, progression, match, ops FROM PUBLIC;
        SELECT 'ALTER ROLE gameservice NOSUPERUSER NOCREATEDB NOCREATEROLE'
        WHERE (SELECT rolsuper FROM pg_roles WHERE rolname = 'gameservice') \gexec
        SQL
    environment:
      DATABASE_URL: postgres://gameservice_admin:${GAMESERVICE_ADMIN_PASSWORD}@postgres:5432/gameservice?sslmode=disable
      NAKAMA_DATABASE_PASSWORD: ${NAKAMA_DATABASE_PASSWORD:?set NAKAMA_DATABASE_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }
      database-admin-bootstrap: { condition: service_completed_successfully }
  nakama:
    image: heroiclabs/nakama@sha256:92fb184e3271be12fd4d239766afb285322a50aaf769a59433445d59624c78cd
    depends_on:
      postgres: { condition: service_healthy }
      migrations: { condition: service_completed_successfully }
      database-admin-bootstrap: { condition: service_completed_successfully }
      nakama-role-bootstrap: { condition: service_completed_successfully }
    entrypoint: ["/bin/sh", "-ec"]
    command: ["/nakama/nakama migrate up --database.address nakama:${NAKAMA_DATABASE_PASSWORD}@postgres:5432/gameservice && exec /nakama/nakama --database.address nakama:${NAKAMA_DATABASE_PASSWORD}@postgres:5432/gameservice --logger.level INFO --console.username ${NAKAMA_CONSOLE_USERNAME} --console.password ${NAKAMA_CONSOLE_PASSWORD} --console.signing_key ${NAKAMA_CONSOLE_SIGNING_KEY} --socket.server_key ${NAKAMA_SOCKET_SERVER_KEY} --session.encryption_key ${NAKAMA_SESSION_ENCRYPTION_KEY} --session.refresh_encryption_key ${NAKAMA_SESSION_REFRESH_ENCRYPTION_KEY} --runtime.http_key ${NAKAMA_RUNTIME_HTTP_KEY} --runtime.env GAMESERVICE_MODERATION_BLOCKLIST=${GAMESERVICE_MODERATION_BLOCKLIST:-}"]
    ports: ["7350:7350", "7351:7351"]
    volumes: [../../nakama/runtime:/nakama/data/modules:ro]
  control-api:
    build: { context: ../.., dockerfile: deploy/compose/control-api.Dockerfile }
    environment:
      CONTROL_API_ADDR: :8080
      DATABASE_URL: postgres://gameservice:${POSTGRES_PASSWORD}@postgres:5432/gameservice?sslmode=disable
      NAKAMA_URL: ${NAKAMA_URL:-http://nakama:7350}
      NAKAMA_SESSION_SIGNING_KEY: ${NAKAMA_SESSION_SIGNING_KEY:-${NAKAMA_SESSION_ENCRYPTION_KEY}}
      NAKAMA_SESSION_ISSUER: ${NAKAMA_SESSION_ISSUER:-}
      NAKAMA_SESSION_AUDIENCE: ${NAKAMA_SESSION_AUDIENCE:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-otel-collector:4318}
      SERVER_CLAIM_PUBLIC_KEYS: ${SERVER_CLAIM_PUBLIC_KEYS:-}
      SERVER_CLAIM_PUBLIC_KEY: ${SERVER_CLAIM_PUBLIC_KEY:-}
      JOIN_CLAIM_PRIVATE_KEY: ${JOIN_CLAIM_PRIVATE_KEY:-}
      NAKAMA_RUNTIME_HTTP_KEY: ${NAKAMA_RUNTIME_HTTP_KEY:?set NAKAMA_RUNTIME_HTTP_KEY}
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      migrations: { condition: service_completed_successfully }
  turn:
    image: coturn/coturn@sha256:71c3c990283385567f11794ee692e3a47b66fd9b0bb39e42afbe776e331dd888
    command: >-
      -n --log-file=stdout --realm=${TURN_REALM:?set TURN_REALM}
      --use-auth-secret --static-auth-secret=${TURN_SECRET:?set TURN_SECRET}
      --listening-port=3478 --tls-listening-port=5349
      --external-ip=${TURN_EXTERNAL_IP:?set TURN_EXTERNAL_IP}
      --min-port=49152 --max-port=49251 --no-cli
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/tcp"
      - "49152-49251:49152-49251/udp"
  migrations:
    image: postgres@sha256:21f6013073bc6b92830a2129570e2f5ec42a6c734b5a985a41e83aa58f54c3c1
    entrypoint: ["sh", "-c"]
    command: ["set -eu; for migration in /migrations/*.sql; do case \"$$migration\" in *.down.sql) continue ;; esac; psql \"$$DATABASE_URL\" -v ON_ERROR_STOP=1 -f \"$$migration\"; done"]
    environment:
      DATABASE_URL: postgres://gameservice:${POSTGRES_PASSWORD}@postgres:5432/gameservice?sslmode=disable
    volumes: [../../migrations/control:/migrations:ro]
    depends_on:
      postgres: { condition: service_healthy }
      database-admin-bootstrap: { condition: service_completed_successfully }
  seed:
    profiles: [seed]
    build: { context: ../.., dockerfile: deploy/compose/seed.Dockerfile }
    command: ["--file", "/definitions/examples/arena.yaml"]
    environment:
      DATABASE_URL: postgres://gameservice:${POSTGRES_PASSWORD}@postgres:5432/gameservice?sslmode=disable
      SEED_ENVIRONMENT: ${SEED_ENVIRONMENT:-dev}
      SEED_ACTOR: ${SEED_ACTOR:-seed}
    depends_on:
      postgres: { condition: service_healthy }
      migrations: { condition: service_completed_successfully }
  outbox-worker:
    build: { context: ../.., dockerfile: deploy/compose/outbox-worker.Dockerfile }
    environment:
      DATABASE_URL: postgres://gameservice:${POSTGRES_PASSWORD}@postgres:5432/gameservice?sslmode=disable
      OUTBOX_CONSUMER: ${OUTBOX_CONSUMER:-stdout}
    depends_on:
      postgres: { condition: service_healthy }
      migrations: { condition: service_completed_successfully }
  reconciliation-worker:
    profiles: [reconciliation]
    build: { context: ../.., dockerfile: deploy/compose/reconciliation-worker.Dockerfile }
    environment:
      DATABASE_URL: postgres://gameservice:${POSTGRES_PASSWORD}@postgres:5432/gameservice?sslmode=disable
      RECONCILIATION_INTERVAL_SECONDS: ${RECONCILIATION_INTERVAL_SECONDS:-300}
    depends_on:
      postgres: { condition: service_healthy }
      migrations: { condition: service_completed_successfully }
  leaderboard-worker:
    profiles: [leaderboards]
    build: { context: ../.., dockerfile: deploy/compose/leaderboard-worker.Dockerfile }
    environment:
      DATABASE_URL: postgres://gameservice:${POSTGRES_PASSWORD}@postgres:5432/gameservice?sslmode=disable
      NAKAMA_URL: ${NAKAMA_URL:-http://nakama:7350}
      NAKAMA_SOCKET_SERVER_KEY: ${NAKAMA_SOCKET_SERVER_KEY:?set NAKAMA_SOCKET_SERVER_KEY}
      NAKAMA_RUNTIME_HTTP_KEY: ${NAKAMA_RUNTIME_HTTP_KEY:?set NAKAMA_RUNTIME_HTTP_KEY}
    depends_on:
      postgres: { condition: service_healthy }
      nakama: { condition: service_started }
      migrations: { condition: service_completed_successfully }
  matchmaking-worker:
    profiles: [matchmaking]
    build: { context: ../.., dockerfile: deploy/compose/matchmaking-worker.Dockerfile }
    environment:
      DATABASE_URL: postgres://gameservice:${POSTGRES_PASSWORD}@postgres:5432/gameservice?sslmode=disable
      AGONES_ALLOCATOR_ENDPOINT: ${AGONES_ALLOCATOR_ENDPOINT:-}
      AGONES_ALLOCATOR_SERVER_NAME: ${AGONES_ALLOCATOR_SERVER_NAME:-}
      AGONES_ALLOCATOR_NAMESPACE: ${AGONES_ALLOCATOR_NAMESPACE:-default}
      AGONES_ALLOCATOR_CA_FILE: /run/allocator/ca.pem
      AGONES_ALLOCATOR_CERT_FILE: /run/allocator/client.crt
      AGONES_ALLOCATOR_KEY_FILE: /run/allocator/client.key
      MATCH_TEAM_SIZE: ${MATCH_TEAM_SIZE:-1}
      MATCH_TEAMS: ${MATCH_TEAMS:-2}
      MATCH_RATING_WINDOW: ${MATCH_RATING_WINDOW:-0}
      MATCH_PROTOCOL: ${MATCH_PROTOCOL:-udp}
      SERVER_CLAIM_PRIVATE_KEY: ${SERVER_CLAIM_PRIVATE_KEY:-}
      SERVER_CLAIM_TTL_SECONDS: ${SERVER_CLAIM_TTL_SECONDS:-600}
    volumes:
      - ${AGONES_ALLOCATOR_SECRET_DIR:-/var/empty/gameservice-allocator}:/run/allocator:ro
    depends_on:
      postgres: { condition: service_healthy }
      migrations: { condition: service_completed_successfully }
  simulator-server:
    profiles: [simulator]
    build: { context: ../.., dockerfile: deploy/compose/simulator-server.Dockerfile }
    environment:
      SIMULATOR_ADDR: :7000
      MATCH_ID: ${MATCH_ID:-}
      ALLOCATION_ID: ${ALLOCATION_ID:-}
      SERVER_BUILD: ${SERVER_BUILD:-}
      MATCH_ROSTER: ${MATCH_ROSTER:-}
      SERVER_CLAIM_PUBLIC_KEY: ${SERVER_CLAIM_PUBLIC_KEY:-}
      CONTROL_API_URL: ${CONTROL_API_URL:-http://control-api:8080}
      SERVER_RESULT_TOKEN: ${SERVER_RESULT_TOKEN:-}
      AGONES_ENABLED: ${AGONES_ENABLED:-false}
    ports: ["7000:7000"]
volumes:
  postgres-data: {}
  prometheus-data: {}
  alertmanager-data: {}
  grafana-data: {}
