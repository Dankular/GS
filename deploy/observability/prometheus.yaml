global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/prometheus-rules.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: gameservice-control-api
    metrics_path: /metrics
    static_configs:
      - targets: [control-api:8080]
  - job_name: gameservice-otel
    static_configs:
      - targets: [otel-collector:9464]
