apiVersion: v1
kind: Namespace
metadata:
  name: platform-gameservers-eu-west
---
apiVersion: agones.dev/v1
kind: Fleet
metadata:
  name: arena-deathmatch
  namespace: platform-gameservers-eu-west
spec:
  replicas: 2
  template:
    metadata:
      labels:
        platform.game/id: arena
        platform.game/mode: deathmatch
        platform.game/build: dev
        platform.game/region: eu-west
        platform.game/protocol: udp
    spec:
      ports:
        - name: game
          containerPort: 7000
      template:
        spec:
          containers:
            - name: game-server
              image: gameservice-simulator:dev
              imagePullPolicy: Never
              env:
                - name: SIMULATOR_ADDR
                  value: ":7000"
                - name: MATCH_ID
                  value: "kind-smoke-match"
                - name: ALLOCATION_ID
                  value: "kind-smoke-allocation"
                - name: SERVER_BUILD
                  value: dev
                - name: MATCH_ROSTER
                  value: "kind-player:0"
                - name: SERVER_CLAIM_PUBLIC_KEY
                  value: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA
                - name: AGONES_ENABLED
                  value: "true"
                - name: CONTROL_API_URL
                  value: http://control-api:8080
              securityContext:
                runAsNonRoot: true
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { cpu: 1, memory: 512Mi }
              readinessProbe:
                httpGet: { path: /health/ready, port: 7000 }
                periodSeconds: 5
---
apiVersion: autoscaling.agones.dev/v1
kind: FleetAutoscaler
metadata:
  name: arena-deathmatch
  namespace: platform-gameservers-eu-west
spec:
  fleetName: arena-deathmatch
  policy:
    buffer:
      bufferSize: 2
